<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Запропонувати місто</title>
	</head>
	<body>
		<header>
			<h1>Запропонувати місто</h1>
			<nav>
				<ul>
					<li><a href="index.html">Головна</a></li>
					<li><a href="kharkiv.html">Харків</a></li>
					<li><a href="lviv.html">Львів</a></li>
					<li><a href="odesa.html">Одеса</a></li>
					<li><a href="form.html">Запропонувати місто</a></li>
				</ul>
			</nav>
		</header>

		<main>
			<section>
				<h2>Місто для наступного рейтингу</h2>
				<form action="#" method="post">
					<p>
						<label for="city">Назва міста:</label><br>
						<input type="text" id="city" name="city" required>
					</p>
					<p>
						<label for="country">Країна:</label><br>
						<input type="text" id="country" name="country" required>
					</p>
					<p>
						<label for="reason">Чому варто відвідати це місто?</label><br>
						<textarea id="reason" name="reason" rows="6" cols="40" required></textarea>
					</p>
					<p>
						<label for="type">Що найбільше цікавить у місті?</label><br>
						<select id="type" name="type" required>
							<option value="">Оберіть варіант</option>
							<option value="history">Історія та архітектура</option>
							<option value="nature">Природа та відпочинок</option>
							<option value="culture">Культура та події</option>
						</select>
					</p>
					<fieldset>
						<legend>Який матеріал про місто підготувати?</legend>
						<label><input type="radio" name="material" value="facts" required> Цікаві факти</label><br>
						<label><input type="radio" name="material" value="places"> Визначні місця</label><br>
						<label><input type="radio" name="material" value="route"> Маршрут для подорожі</label>
					</fieldset>
					<p><button type="submit">Надіслати пропозицію</button></p>
				</form>
			</section>
			<p><a href="index.html">Повернутися на головну сторінку</a></p>
		</main>

		<footer>
			<p>Автор: студент групи КН-41 Форемський Орест, 2026</p>
		</footer>
	</body>
</html>
